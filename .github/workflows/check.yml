name: Check portfolio
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Inspect dependency audit
        run: |
          npm audit --json > /tmp/cascadia-audit.json || true
          echo CASCADIA_AUDIT_BEGIN
          cat /tmp/cascadia-audit.json
          echo CASCADIA_AUDIT_END
      - run: npm run verify
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser test driver
        run: pip install playwright==1.58.0
      - name: Test responsive layouts and accessibility interactions
        run: |
          python -m http.server 4321 --directory dist --bind 127.0.0.1 > /tmp/cascadia-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python scripts/check-browser.py
      - name: Upload browser review artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: portfolio-browser-review
          path: test-results/
          if-no-files-found: ignore
      - name: Export build for local visual verification
        if: success()
        run: |
          tar --exclude='dist/fonts' --exclude='dist/images' --exclude='dist/resume.pdf' -czf /tmp/cascadia-review.tgz dist
          echo CASCADIA_BUILD_BEGIN
          base64 /tmp/cascadia-review.tgz
          echo CASCADIA_BUILD_END
